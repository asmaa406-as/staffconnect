{% extends "base.html" %}
{% block title %}Register — StaffConnect{% endblock %}
{% block content %}
<h1>Create your account</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Register</button>
</form>
<p>Already have an account? <a href="{% url 'users:login' %}">Log in</a></p>
{% endblock %}
