{% extends "base.html" %}
{% block title %}Delete Announcement{% endblock %}
{% block content %}
<h1>Delete "{{ post.title }}"?</h1>
<p>This action cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn danger">Yes, delete</button>
    <a href="{% url 'posts:detail' post.slug %}">Cancel</a>
</form>
{% endblock %}
